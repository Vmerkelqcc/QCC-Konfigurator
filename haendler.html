function fromB64(s){const binary=atob(s);const b=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)b[i]=binary.charCodeAt(i);return b;}
const f=document.getElementById('unlock');
f.addEventListener('submit',async e=>{
 e.preventDefault();const msg=document.getElementById('msg');const btn=document.getElementById('submit');const pwd=document.getElementById('password').value;
 msg.textContent='';btn.disabled=true;btn.textContent='Entschlüsseln …';
 try{
  if(!window.crypto?.subtle)throw new Error('Zum Entsperren ist HTTPS oder localhost erforderlich.');
  if(!('DecompressionStream' in window))throw new Error('Dein Browser benötigt Unterstützung für gzip (DecompressionStream).');
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pwd),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:fromB64(data.salt),iterations:data.iterations,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const raw=await crypto.subtle.decrypt({name:'AES-GCM',iv:fromB64(data.iv)},key,fromB64(data.ciphertext));
  const stream=new Blob([raw]).stream().pipeThrough(new DecompressionStream('gzip'));
  const code=await new Response(stream).text();
  document.open();document.write(code);document.close();
 }catch(err){msg.textContent=err?.name==='OperationError'?'Passwort nicht korrekt. Bitte erneut versuchen.':(err?.message||'Entschlüsselung fehlgeschlagen.');btn.disabled=false;btn.textContent='Konfigurator entsperren';}
