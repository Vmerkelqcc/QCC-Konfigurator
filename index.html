function _decode64(s){return Uint8Array.from(atob(s),ch=>ch.charCodeAt(0))}
const _form=document.getElementById('login'),_input=document.getElementById('kennwort'),_button=document.getElementById('oeffnen'),_msg=document.getElementById('meldung');
_form.addEventListener('submit',async ev=>{
 ev.preventDefault();
 if(!_input.value)return;
 _button.disabled=true;_msg.style.color='#555';_msg.textContent='Zugang wird geprüft …';
 try {
   if(!window.crypto?.subtle)throw new Error('WebCrypto wird benötigt. Bitte die Seite über HTTPS öffnen.');
   const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(_input.value),'PBKDF2',false,['deriveKey']);
   const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:_decode64(_salt),iterations:_count,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
   const raw=await crypto.subtle.decrypt({name:'AES-GCM',iv:_decode64(_nonce),additionalData:new TextEncoder().encode('QCC-7.37-Pages')},key,_decode64(_cipher));
   const html=new TextDecoder().decode(raw);
   _input.value='';
   document.open();document.write(html);document.close();
 } catch(e) {
   _msg.style.color='#a1291f';_msg.textContent=e.message.includes('WebCrypto')?e.message:'Passwort nicht korrekt. Bitte erneut versuchen.';
   _input.focus();_input.select();_button.disabled=false;
 }
});
